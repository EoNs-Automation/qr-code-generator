<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator | EoNs Automation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 18px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button:hover {
            background: #0d47a1;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 25px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            border: 1px solid #333;
            min-height: 200px;
            align-items: center;
        }
        #qrcode img, #qrcode canvas {
            border-radius: 6px;
        }
        .placeholder {
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>QR Code Generator</h1>
    <p class="subtitle">EoNs Automation</p>

    <label for="text">Text or URL</label>
    <input type="text" id="text" placeholder="e.g. https://eonsautomation.dev">

    <button onclick="generateQR()">Generate QR Code</button>
    <button onclick="downloadQR()" style="background:#333;">Download QR Code</button>

    <div id="qrcode">
        <div class="placeholder">Your QR code will appear here</div>
    </div>

    <script>
        let qrcode = null;

        function generateQR() {
            const text = document.getElementById("text").value.trim();
            const container = document.getElementById("qrcode");

            if (!text) {
                alert("Please enter some text or a URL.");
                return;
            }

            // Clear previous QR code
            container.innerHTML = "";

            // Generate new QR code
            qrcode = new QRCode(container, {
                text: text,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const canvas = document.querySelector("#qrcode canvas");
            if (!canvas) {
                alert("Generate a QR code first.");
                return;
            }

            const link = document.createElement("a");
            link.download = "qrcode.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>

</body>
</html>
